[pytest]
addopts =
  # Pre-load the `pytest-cov` plugin early:
  -p pytest_cov

  # `pytest-cov`:
  --cov-config=.coveragerc.toml

  # Fail on config parsing warnings:
  --strict-config

  # Fail on non-existing markers:
  --strict-markers
asyncio_mode = auto
filterwarnings =
  error
testpaths = tests/
xfail_strict = true
